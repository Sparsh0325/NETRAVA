server:
  port: ${PORT:${SERVER_PORT:8085}}

spring:
  application:
    name: intellishare-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5436}/${DB_NAME:intellishare}}
    username: ${DB_USERNAME:intellishare_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

intellishare:
  version: 0.1.0-alpha
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT1H}
  ai:
    gemini-api-key: ${INTELLISHARE_AI_GEMINI_API_KEY:}
    gemini-model: ${INTELLISHARE_AI_GEMINI_MODEL:gemini-3.8-flash}
